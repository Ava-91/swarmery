name: swarmery-release

# Cut a versioned swarmery build by pushing a tag:
#   git tag swarmery-v0.1.0 && git push origin swarmery-v0.1.0
# The job builds the daemon for the common host targets and publishes them on a
# GitHub Release, giving `tools/swarmery` a fixed rollback point (see the
# "Rollback" section of tools/swarmery/README.md).

on:
  push:
    tags: ['swarmery-v*']

defaults:
  run:
    working-directory: tools/swarmery

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release + upload binaries
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/swarmery/go.mod
          cache-dependency-path: tools/swarmery/go.sum

      - name: Build web
        working-directory: tools/swarmery/web
        run: |
          npm ci
          npm run build

      - name: Cross-compile binaries
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#swarmery-}"
          # Stamp the tag into the binary (internal/version): the release build
          # reports the tag it was cut from, not whatever semver happens to sit
          # in version.go. The checkout is shallow, so the tag comes from the
          # ref rather than `git describe`.
          pkg="github.com/atretyak1985/swarmery/tools/swarmery/internal/version"
          ldflags="-s -w -X ${pkg}.Version=${version#v} -X ${pkg}.Build=${GITHUB_REF_NAME}"
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            out="dist/swarmery-${version}-${os}-${arch}"
            echo "building $out"
            GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 \
              go build -trimpath -ldflags "$ldflags" -o "$out" ./cmd/swarmery
          done
          ( cd dist && sha256sum swarmery-* > SHA256SUMS )

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            dist/swarmery-* dist/SHA256SUMS
