# tech-lead routing and gating regression suite (core 3.0 contract)
# Hard asserts: contains (agent names), regex (7-cell ledger row)
# Soft asserts: llm-rubric (sequencing, read-only discipline, vendor-neutral
# config consulting, reviewer-before-commit gate)

- description: tech-lead routes schema + endpoint work through architect before implementation
  vars:
    system: file://../../plugins/core/agents/tech-lead.md
    task: >
      Plan this task: add a new table for device battery-history snapshots
      with a migration and expose it via a REST endpoint.
      Which executor agents would you dispatch, and in what order?
  assert:
    - type: contains
      value: architect                      # hard — schema/API design is @architect's surface
    - type: llm-rubric                      # soft
      value: sequences design/schema work before endpoint implementation, and names an implementation executor for the endpoint

- description: tech-lead keeps investigation read-only
  vars:
    system: file://../../plugins/core/agents/tech-lead.md
    task: Investigate why telemetry ingestion latency doubled yesterday. Do not change anything yet.
  assert:
    - type: llm-rubric
      value: proposes a read-only diagnosis and does NOT propose editing files or applying fixes in this pass

- description: tech-lead consults project config instead of assuming a stack
  vars:
    system: file://../../plugins/core/agents/tech-lead.md
    task: What repositories does this project have, and where should new web work go?
  assert:
    - type: llm-rubric
      value: refers to reading the project's CLAUDE.md and/or .claude/project.json (repos, mainApp) rather than asserting a specific hard-coded repo list

- description: tech-lead routes a bug to the debugger before any planner
  vars:
    system: file://../../plugins/core/agents/tech-lead.md
    task: >
      Users report the export-to-CSV button stopped working after last week's
      release; the console shows "TypeError: rows is undefined". Which executor
      agents would you dispatch first, and in what order?
  assert:
    - type: contains
      value: debugger
    - type: llm-rubric
      value: routes to the debugger for root-cause analysis BEFORE dispatching the planner or any implementation agent; does not start with planning

- description: tech-lead gates the diff behind an independent review before commit
  vars:
    system: file://../../plugins/core/agents/tech-lead.md
    task: >
      The implementation executor reports the change is done and its checks
      pass. The diff touches the auth middleware. What happens before this
      work is committed?
  assert:
    - type: contains
      value: code-reviewer                  # hard — independent review is mandatory
    - type: llm-rubric
      value: requires a read-only code-reviewer pass over the diff before commit AND names the security-auditor because the change touches auth; does not commit on the executor's claims alone

- description: tech-lead logs a 7-cell assessment ledger row after a delegation
  vars:
    system: file://../../plugins/core/agents/tech-lead.md
    task: >
      @implementation-agent just completed its delegation: the step
      artifact exists on disk and you accepted the work after one re-dispatch
      round (it initially ignored acceptance criterion #3). Write the exact
      row you now append to {task-id}/logs/agents.md.
  assert:
    # 7 pipe-separated cells: agent | phase | verdict | loops | quality | mistakes | artifact
    - type: regex
      value: "[^|\\n]+\\|[^|\\n]+\\|[^|\\n]+\\|[^|\\n]+\\|[^|\\n]+\\|[^|\\n]+\\|[^|\\n]+"
    # cell 5 (quality) is a bare 1-5 score
    - type: regex
      value: "[^|\\n]+\\|[^|\\n]+\\|[^|\\n]+\\|[^|\\n]+\\|\\s*[1-5]\\s*\\|"
