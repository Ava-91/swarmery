# swarmery eval harness — golden regression tests for critical core agents.
# Run: cd evals && npx promptfoo@latest eval   (needs ANTHROPIC_API_KEY)
# Purpose: editing plugins/core/agents/*.md must not silently break routing,
# output contracts, or vendor-neutrality. Grow this corpus from real incidents.

description: swarmery core agent regression suite

prompts:
  - file://prompts/agent-chat.json

providers:
  - id: anthropic:messages:claude-haiku-4-5-20251001
    config:
      max_tokens: 1024

defaultTest:
  options:
    provider:
      # judge for llm-rubric assertions — promptfoo needs a concrete model id,
      # not an alias; bump this deliberately when the fleet's judge tier moves
      # (the reference-integrity CI gate bans retired ids in plugins/**, and
      # this file is the one sanctioned pin outside it).
      id: anthropic:messages:claude-sonnet-5

tests:
  - file://agents/tech-lead.yaml
  - file://agents/planner.yaml
  - file://agents/verification-agent.yaml
  - file://agents/implementation-agent.yaml
  - file://agents/security-auditor.yaml
  - file://agents/git-commit.yaml
  - file://agents/guardrails.yaml
  - file://agents/jira-task-runner.yaml
